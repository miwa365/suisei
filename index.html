<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XL-001 彗星 | UNOFFICIAL OBSERVATION ARCHIVE</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@200;300;400;500&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-space: #06080F;
      --gold-accent: #E2C691;
      --gold-dim: rgba(226, 198, 145, 0.35);
      --silver-border: rgba(255, 255, 255, 0.16);
      --glass-bg: rgba(13, 17, 30, 0.58);
      --text-main: #F2F4F8;
      --text-sub: rgba(242, 244, 248, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-space);
      color: var(--text-main);
      font-family: 'Shippori Mincho', serif;
      line-height: 1.8;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .cosmos-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 18% 15%, rgba(56, 189, 248, 0.14), transparent 42%),
        radial-gradient(circle at 82% 28%, rgba(168, 85, 247, 0.14), transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(244, 63, 94, 0.10), transparent 50%),
        #06080F;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    header {
      text-align: center;
      padding: 36px 20px 44px;
      border-bottom: 1px solid var(--silver-border);
      margin-bottom: 44px;
      position: relative;
    }

    .sys-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.28em;
      color: var(--gold-accent);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: block;
    }

    h1 {
      font-family: 'Cinzel', 'Shippori Mincho', serif;
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      color: #FFFFFF;
      text-shadow: 0 0 24px rgba(226, 198, 145, 0.28);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--text-sub);
      letter-spacing: 0.12em;
      margin-bottom: 28px;
    }

    .portal-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-portal {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 26px;
      background: linear-gradient(135deg, rgba(226, 198, 145, 0.14), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--gold-accent);
      color: #FFFFFF;
      text-decoration: none;
      transition: all 0.3s ease;
      min-width: 210px;
    }

    .btn-portal.sub {
      border-color: var(--silver-border);
      background: rgba(255, 255, 255, 0.03);
    }

    .btn-portal:hover {
      background: rgba(226, 198, 145, 0.24);
      box-shadow: 0 0 20px rgba(226, 198, 145, 0.25);
      transform: translateY(-2px);
    }

    .btn-portal-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--gold-accent);
    }

    .btn-portal-main {
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      margin-top: 2px;
    }

    section { margin-bottom: 52px; }

    .sec-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .sec-num {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: var(--gold-accent);
      letter-spacing: 0.2em;
    }

    .sec-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.24em;
      color: #FFFFFF;
      text-transform: uppercase;
    }

    .sec-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--silver-border), transparent);
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--silver-border);
      padding: 28px 24px;
      position: relative;
      overflow: hidden;
    }

    .glass-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 40px;
      height: 1px;
      background: var(--gold-accent);
    }

    .member-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--silver-border);
      color: var(--text-sub);
      padding: 8px 14px;
      font-family: 'Shippori Mincho', serif;
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn:hover { border-color: var(--gold-dim); color: #FFFFFF; }

    .tab-btn.active {
      background: rgba(226, 198, 145, 0.16);
      border-color: var(--gold-accent);
      color: var(--gold-accent);
      box-shadow: 0 0 12px rgba(226, 198, 145, 0.18);
    }

    .profile-card { position: relative; min-height: 210px; }

    .watermark-en {
      position: absolute;
      top: -6px;
      right: 6px;
      font-family: 'Cinzel', serif;
      font-size: clamp(2.8rem, 8vw, 4.5rem);
      font-weight: 600;
      color: rgba(255, 255, 255, 0.04);
      letter-spacing: 0.12em;
      pointer-events: none;
      user-select: none;
    }

    .member-role {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      color: var(--gold-accent);
      margin-bottom: 4px;
    }

    .member-name-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--silver-border);
    }

    .member-jp { font-size: 1.55rem; font-weight: 500; letter-spacing: 0.14em; }
    .member-en { font-family: 'Cinzel', serif; font-size: 0.95rem; color: var(--text-sub); letter-spacing: 0.2em; }
    .member-desc { font-size: 0.94rem; color: var(--text-main); line-height: 1.9; }

    .personal-comms-box {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .comms-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.5);
    }

    .comms-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      background: rgba(226, 198, 145, 0.08);
      border: 1px solid rgba(226, 198, 145, 0.55);
      color: var(--gold-accent);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .comms-link-btn:hover {
      background: rgba(226, 198, 145, 0.22);
      box-shadow: 0 0 15px rgba(226, 198, 145, 0.3);
    }

    .comms-link-disabled {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.35);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
    }

    .terminal-note { font-size: 0.84rem; color: var(--text-sub); margin-bottom: 16px; }
    .phrase-list { display: grid; gap: 10px; }

    .phrase-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .phrase-cn { font-size: 1rem; color: #FFFFFF; letter-spacing: 0.06em; }
    .phrase-jp { font-size: 0.78rem; color: var(--text-sub); margin-top: 2px; }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--gold-accent);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      padding: 7px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .copy-btn:hover { background: rgba(226, 198, 145, 0.15); border-color: var(--gold-accent); }
    .copy-btn.copied { background: var(--gold-accent); color: #06080F; font-weight: 500; }

    .info-grid { display: grid; gap: 18px; }
    .info-block h3 { font-size: 0.95rem; color: var(--gold-accent); letter-spacing: 0.1em; margin-bottom: 6px; font-weight: 500; }
    .info-block p { font-size: 0.88rem; color: var(--text-sub); }

    .web-charge-link {
      display: inline-block;
      margin-top: 10px;
      color: var(--gold-accent);
      font-size: 0.84rem;
      text-decoration: none;
      border-bottom: 1px solid var(--gold-dim);
      padding-bottom: 2px;
    }

    .web-charge-link:hover { border-color: var(--gold-accent); }

    footer {
      text-align: center;
      padding-top: 32px;
      border-top: 1px solid var(--silver-border);
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .disclaimer {
      max-width: 640px;
      margin: 0 auto 16px;
      line-height: 1.7;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.45);
    }

    .archive-credit {
      font-family: 'Cinzel', serif;
